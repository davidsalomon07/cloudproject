spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/monitoring
    username: postgres
    password: ${POSTGRES_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: false

app:
  api-key: ${API_KEY:changeme-in-production}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
